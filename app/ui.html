<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>ShortsMaker</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect x='40' y='40' width='944' height='944' rx='230' fill='%2316161c'/%3E%3Crect x='150' y='330' width='724' height='364' rx='54' fill='none' stroke='%23fff' stroke-opacity='.28' stroke-width='26'/%3E%3Cg transform='rotate(8 512 476)'%3E%3Crect x='352' y='192' width='320' height='568' rx='64' fill='%23ffcc33'/%3E%3Cpath d='M470 382V570L618 476Z' fill='%2316161c'/%3E%3C/g%3E%3Crect x='312' y='838' width='400' height='32' rx='16' fill='%23ffcc33'/%3E%3Crect x='312' y='838' width='158' height='32' rx='16' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* У дусі DaVinci Resolve: теплі нейтральні сірі, майже монохромно; один теплий акцент лише для головного —
   основна дія, вибране, область аналізу. Статуси й мережі — крапками й іконками, а не заливками. */
:root{
  --bg:#151413;--s1:#1d1c1b;--s2:#242322;--s3:#2d2c2a;--s4:#383634;--line:#2b2a28;--line2:#3d3b38;
  --fg:#e2dfda;--hi:#f4f2ee;--mut:#9b968f;--dim:#64605b;
  --acc:#f2b33d;--acc-ink:#1b1712;--acc-soft:#3a3023;
  --red:#d2645a;--green:#6aa87a;--blue:#6b95c9;
  --r:6px;--r-sm:4px;--fast:120ms;--ease:cubic-bezier(.4,0,.2,1);--pop:0 10px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;grid-template-rows:auto 1fr;background:var(--bg);color:var(--fg);font:13px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
:focus:not(:focus-visible){outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
::selection{background:var(--acc-soft)}
/* шапка: тиха смуга, як рядок сторінок у Resolve */
header{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;border-bottom:1px solid #0e0d0c;background:var(--s1)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;letter-spacing:-.01em;margin-right:8px;color:var(--hi)}.logo b{color:var(--acc);font-weight:700}
.mark{width:24px;height:24px;flex:none}
.hero{display:flex;align-items:center;gap:14px}.hero .mark{width:48px;height:48px}
.hero small{display:block;color:var(--mut);font-size:13px;font-weight:400;letter-spacing:0;margin-top:2px}
nav{display:inline-flex;gap:2px;padding:2px;background:#121110;border:1px solid var(--line);border-radius:var(--r-sm)}
nav button{border:0;background:none;color:var(--mut);border-radius:3px;padding:5px 14px;font-weight:600}
nav button:hover{color:var(--fg);background:var(--s2)}nav button.on{background:var(--s4);color:var(--hi)}
#pname{max-width:280px;background:none;border-color:transparent;font-weight:600;font-size:14px;color:var(--hi)}#pname:hover{border-color:var(--line2)}
.grow{flex:1}
#busy{display:grid;grid-template-columns:10px auto auto 120px;align-content:center;align-items:center;gap:2px 8px;color:var(--mut);font-size:12px;line-height:1.2;font-variant-numeric:tabular-nums}#busy:empty{display:none}
#support{display:inline-flex;align-items:center;gap:6px;color:var(--mut)}#support svg{width:14px;height:14px;color:#e2533f}#support:hover{color:var(--hi)}
.support{margin:28px 0 8px;color:var(--dim);font-size:12.5px;text-align:center}.support .link{background:none;border:0;padding:0;color:var(--mut);text-decoration:underline;cursor:pointer}.support .link:hover{color:var(--hi)}
#upd{color:var(--acc);border-color:var(--acc-soft)}#upd:hover{background:var(--acc-soft);color:var(--hi)}
#busy .bt{display:contents}#busy .bt:nth-child(n+3){display:none}   /* не більше двох рядків */                                        /* рядки однієї сітки: назви, відсотки й смужки стоять стовпчиками */
#busy .bt>b{color:var(--fg);font-weight:600}#busy .bt>span:not(.pb){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
#busy .pb{height:4px;background:var(--s4);border-radius:2px;overflow:hidden}#busy .pb b{display:block;height:100%;width:0;background:var(--acc);transition:width .6s var(--ease)}
#busy i{width:10px;height:10px;border:2px solid var(--s4);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* базові контроли */
h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:600}
label{display:block;color:var(--mut);font-size:12px;margin:12px 0 5px}
input,textarea,select{width:100%;background:#121110;color:var(--fg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 9px;font:inherit;transition:border-color var(--fast) var(--ease)}
input:hover,textarea:hover,select:hover{border-color:#4d4a46}
input:focus,textarea:focus,select:focus{border-color:#7a756e;outline:none}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{resize:vertical;min-height:56px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);height:20px}
input[type=checkbox]{accent-color:var(--acc)}
button{background:var(--s3);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 12px;font:inherit;cursor:pointer;white-space:nowrap;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),color var(--fast)}
button:hover{background:var(--s4);border-color:#4d4a46;color:var(--hi)}
button:disabled,button:disabled:hover{background:var(--s2);border-color:var(--line);color:var(--dim);cursor:default}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.pri:hover{background:#f6c260;border-color:#f6c260;color:var(--acc-ink)}
button.pri:disabled,button.pri:disabled:hover{background:var(--s3);border-color:var(--line2);color:var(--dim)}
button.ghost{background:none;border-color:transparent;color:var(--mut)}button.ghost:hover{color:var(--hi);background:var(--s3);border-color:transparent}
.wide{width:100%}.mut{color:var(--mut)}
.row{display:flex;gap:6px;align-items:center}
.panel{background:var(--s1);border:1px solid #0e0d0c;border-radius:var(--r);padding:12px;overflow:auto;min-height:0}
.view{min-height:0;display:none}.view.on{display:grid}
.err{color:var(--red)}.small{font-size:12px}
kbd{background:var(--s3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 5px;font:11px ui-monospace,Consolas,monospace;color:var(--fg)}
/* поповери й меню */
.pop{position:absolute;z-index:20;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--pop);padding:12px;display:none}
.pop.on{display:block}
.anchor{position:relative}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:#121110;border:1px solid var(--line);border-radius:var(--r-sm)}
.seg button{flex:1;padding:5px 8px;background:none;border-color:transparent;color:var(--mut);border-radius:3px}
.seg button:hover{color:var(--fg);background:var(--s2)}.seg button.on{background:var(--s4);color:var(--hi);border-color:transparent}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--line2)}.sw button.on{border-color:var(--hi)}
.sw input{width:30px;height:26px;padding:0;border:0;background:none;cursor:pointer}
.rng{display:grid;grid-template-columns:1fr 58px;gap:8px;align-items:center}.rng output{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.tg{display:flex;justify-content:space-between;align-items:center;margin:12px 0 0;color:var(--fg);cursor:pointer}
.tg input{display:none}.tg i{width:32px;height:18px;border-radius:9px;background:var(--s4);position:relative;transition:background var(--fast)}
.tg i::after{content:'';position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--mut);transition:transform var(--fast) var(--ease),background var(--fast)}
.tg input:checked+i{background:var(--acc)}.tg input:checked+i::after{transform:translateX(14px);background:var(--acc-ink)}
.pick{display:flex;gap:8px;align-items:center}.pick img{width:44px;height:44px;object-fit:cover;border-radius:var(--r-sm);background:#121110;border:1px solid var(--line2)}
.pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12px}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.emo button{font-size:18px;padding:2px 6px;background:#121110}
/* проєкти */
#home{grid-template-rows:auto 1fr;padding:22px 26px;gap:18px;overflow:hidden}
.hh{display:flex;justify-content:space-between;align-items:center}.hh h2{margin:0;font-size:21px;font-weight:650;letter-spacing:-.01em;color:var(--hi)}
#plist{overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:24px}
.proj{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color var(--fast)}
.proj:hover{border-color:var(--line2)}.proj.cur{border-color:#5c4a2a}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ph b{font-size:15px;font-weight:600;color:var(--hi)}.ph .bt{display:flex;gap:6px}
.grid{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.sf{position:relative;flex:0 0 112px;aspect-ratio:9/16;overflow:hidden;border-radius:var(--r-sm);background:#121110;cursor:pointer;border:1px solid var(--line2);transition:border-color var(--fast)}
.sf img{width:100%;height:100%;object-fit:cover;display:block}
.sf span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);border-radius:3px;padding:0 5px;font-size:11px;color:var(--hi)}
.sf.gone{cursor:default;filter:grayscale(1) brightness(.45)}.sf:not(.gone):hover{border-color:var(--mut)}
.empty{color:var(--mut);text-align:center;margin-top:14vh;font-size:15px}
/* редактор */
#editor{grid-template-rows:1fr auto;min-height:0}
.ed{display:grid;grid-template-columns:clamp(300px,22vw,560px) 1fr clamp(340px,25vw,620px);gap:8px;padding:8px 8px 6px;min-height:0}
#layers{display:flex;flex-direction:column;min-height:0;padding:0;overflow:visible}
#layers .top{padding:10px 10px 8px}
.el.away .nm{color:var(--mut)}.el.away .ic{opacity:.45}.el .nm em{font-style:normal;font-size:11px;color:var(--acc);margin-left:6px}
.elgrp{margin:8px 2px 2px;padding:8px 6px 2px;border-top:1px solid var(--line2);font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
#els{display:flex;flex-direction:column;gap:1px;padding:0 6px 8px;max-height:38%;overflow:auto;flex:none}
.el{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 6px 5px 8px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--fast)}
.el:hover{background:var(--s2)}.el.sel{background:var(--s3);box-shadow:inset 2px 0 0 var(--acc)}
.el.off .nm{color:var(--dim)}.el.off .ic{filter:grayscale(1) brightness(.6)}
.ic{width:22px;height:22px;border-radius:3px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#151413;flex:none}
.el .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.el .nm small{color:var(--mut);margin-left:6px}
.el .tl{display:flex;gap:1px;visibility:hidden}.el:hover .tl,.el.sel .tl{visibility:visible}
.el .tl button{padding:1px 6px;background:none;border-color:transparent;color:var(--mut)}.el .tl button:hover{background:var(--s4);color:var(--hi)}
#props{border-top:1px solid var(--line);padding:12px;overflow:auto;flex:1;min-height:0}
#props .hd{display:flex;align-items:center;gap:8px}#props .hd b{font-size:14px;font-weight:600;color:var(--hi)}
#keys{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}#keys.on{display:flex}
#keys .kbox{width:min(880px,calc(100vw - 32px));max-height:86vh;overflow:auto;padding:18px 22px;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--pop)}
#keys .khead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}#keys h3{margin:0;font-size:15px;text-transform:none;letter-spacing:0}
#keysBody{columns:2 380px;column-gap:36px}#keysBody section{break-inside:avoid;margin-bottom:16px}
#keysBody h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:600}
#keysBody dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:13px}#keysBody dt{white-space:nowrap;text-align:right}#keysBody dd{margin:0;color:var(--fg)}
#imp{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}#imp.on{display:flex}
#imp .ibox{width:440px;max-height:80vh;display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--pop)}
#imp h3{margin:0;font-size:15px;text-transform:none;letter-spacing:0}#imp h4{margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:600}
#impList{overflow:auto;min-height:60px}#impList label{display:flex;justify-content:flex-start;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;padding:5px 4px;margin:0;color:var(--fg);cursor:pointer;border-radius:var(--r-sm)}
#impList label:hover{background:var(--s3)}#impList input{width:auto;margin:0;flex:none}#impList .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}#impList .ic{width:20px;height:20px;display:grid;place-items:center;border-radius:5px;font-size:11px;color:#151413}#impList small{color:var(--mut);margin-left:4px}
#imp .row{display:flex;gap:8px}
#cat{left:12px;right:12px;top:52px;max-height:70vh;overflow:auto;width:560px}
#cat h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:600}#cat h4:first-child{margin-top:0}
#cat .cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#cat .cg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;white-space:normal;background:var(--s1);padding:10px;border-color:var(--line)}
#cat .cg button:hover{border-color:var(--line2);background:var(--s3)}
#cat .cg i{font-style:normal;font-size:16px}#cat .cg small{color:var(--mut);font-size:11px;line-height:1.3}
#stage{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;min-width:0}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.segb{display:inline-flex;gap:2px;padding:2px;background:#121110;border:1px solid var(--line);border-radius:var(--r-sm)}
.segb button{border:0;background:none;color:var(--mut);border-radius:3px;padding:5px 12px}.segb button:hover{color:var(--fg);background:var(--s2)}.segb button.on{background:var(--s4);color:var(--hi)}
.chip{display:inline-flex;gap:6px;align-items:center;max-width:280px}.chip span{overflow:hidden;text-overflow:ellipsis}
.cv{flex:1;min-height:0;width:100%;position:relative;overflow:hidden;background:#0f0e0d;border-radius:var(--r)}.cv #pv{position:absolute}
#pvZoom{position:absolute;right:8px;bottom:8px;z-index:2;padding:3px 9px;font-size:12px;font-variant-numeric:tabular-nums;background:rgba(20,19,18,.85);color:var(--fg)}
#pv{display:block;background:#000;touch-action:none}
#cropBar .segb button{padding:5px 9px}
/* контекстне меню */
#ctx{position:fixed;z-index:50;min-width:230px;max-width:330px;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--pop);padding:4px;display:none}
#ctx.on{display:block}
#ctx button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:6px 8px;color:var(--fg)}
#ctx button:hover:not(:disabled){background:var(--s4);color:var(--hi)}#ctx button.on{color:var(--acc)}
#ctx button:disabled{background:none;color:var(--dim)}
#ctx .k{color:var(--dim);font-size:11px}
#ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
#ctx .hd{padding:5px 8px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:600}
#ctx .rw{display:flex;gap:2px;padding:2px 2px 4px}
#ctx .rw button.sw{height:22px;padding:0;background:var(--sw,linear-gradient(135deg,transparent 46%,var(--mut) 47% 53%,transparent 54%) var(--s3));box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#ctx .rw button.sw.on{box-shadow:inset 0 0 0 2px var(--hi)}#ctx .rw button.sw:hover{filter:brightness(1.15)}#ctx .rw button{display:block;flex:1;text-align:center;padding:5px 0;background:var(--s3)}
.ctrl{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;color:var(--mut)}
/* кліпи */
#clips{display:flex;flex-direction:column;overflow:visible}
#clips .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}#clips .head h3{margin:0}
.split{display:flex}.split>button:first-child{flex:1;border-top-right-radius:0;border-bottom-right-radius:0}.split>button+button{border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid #c58f2c;padding:6px 12px}
#list{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:1px;margin-top:8px}
.clip{display:grid;grid-template-columns:auto 28px 64px 8px 64px 1fr auto auto;gap:5px;align-items:center;padding:5px 6px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--fast)}
.clip:hover{background:var(--s2)}.clip.sel{background:var(--s3);box-shadow:inset 2px 0 0 var(--acc)}
.clip[style*='--cc']{box-shadow:inset 3px 0 0 var(--cc)}.clip.sel[style*='--cc']{box-shadow:inset 3px 0 0 var(--cc),inset 0 0 0 1px var(--acc)}
.clip.off b,.clip.off .d,.clip.off input.t{color:var(--dim)}
.clip input[type=checkbox]{width:auto}
.clip input.t{padding:3px 5px;font-variant-numeric:tabular-nums}.clip .d{color:var(--mut);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip button{padding:3px 7px}

.foot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.foot .split .pri{padding:10px}
.bar{height:4px;background:var(--s4);border-radius:2px;overflow:hidden;margin-top:8px}#prog{height:100%;width:0;background:var(--acc);transition:width .3s var(--ease)}
#msg{color:var(--mut);margin-top:6px;min-height:18px;word-break:break-word}#msg.err{color:var(--red)}
#rPop{right:0;left:0;bottom:calc(100% + 6px)}#sPop{left:0;bottom:calc(100% + 6px);width:300px;cursor:default}
footer{padding:0 8px 8px}
#tlGrip{height:12px;margin-bottom:-4px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
#tlGrip::before{content:'';width:48px;height:4px;border-radius:2px;background:var(--line2);transition:background var(--fast),width var(--fast)}
#tlGrip:hover::before{background:var(--mut);width:80px}
/* область аналізу: плашка з діями над таймлайном */
#rbar{position:relative;height:40px;visibility:hidden}#rbar.on{visibility:visible}
#rband{position:absolute;top:8px;bottom:0;background:#26211a;border:1px solid #6e5427;border-bottom:0;border-radius:var(--r-sm) var(--r-sm) 0 0;cursor:grab}
#ract{position:absolute;top:2px;display:flex;gap:8px;align-items:center;padding:3px 6px 3px 10px;background:var(--s2);border:1px solid #6e5427;border-radius:var(--r);cursor:grab;white-space:nowrap;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#ract .rl{color:var(--acc);font-weight:600;font-size:12px}
#ract button{padding:4px 11px}
.inl{display:inline-flex;gap:5px;align-items:center;margin:0;color:var(--fg);font-size:12px;cursor:default}
.inl input[type=number]{width:50px;padding:3px 5px;text-align:center}
.inl input[type=checkbox]{width:auto;margin:0}
.sep{width:1px;height:20px;background:var(--line2)}
.tlwrap{position:relative}
#tl{width:100%;display:block;border:1px solid #0e0d0c;border-radius:0 0 var(--r) var(--r);touch-action:none}

// ── контроли: повзунок, перемикач, вибір, кольори, файл ──
function control(o, k, kind, label, opt) {
  const v = o[k] ?? '';
  if (kind === 'button') return `<button class="wide" data-act="${k}" style="margin-top:12px">${label}</button>`;
  if (kind === 'toggle') return `<label class="tg" data-p="${k}">${label}<input type="checkbox" ${v ? 'checked' : ''}><i></i></label>`;
  let c;
  if (kind === 'range') {
    const [min, max, st, unit, mul = 1] = opt;
    c = `<div class="rng"><input type="range" min="${min}" max="${max}" step="${st}" value="${Math.round(v * mul)}" data-mul="${mul}" data-unit="${unit}"><output>${Math.round(v * mul)} ${unit}</output></div>`;
  } else if (kind === 'seg') c = `<div class="seg">${opt.map(([o2, l]) => `<button data-v="${o2}" class="${String(v) === String(o2) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  else if (kind === 'color') c = `<div class="sw">${COLORS.map(x => `<button data-v="${x}" style="background:${x}" class="${v === x ? 'on' : ''}" aria-label="${x}"></button>`).join('')}<input type="color" value="${esc(v || '#ffffff')}" aria-label="Свій колір"></div>`;
  else if (kind === 'file') c = `<div class="pick">${v ? `<img src="${fileUrl(v)}" alt="">` : ''}<span>${esc(v.split(/[\\/]/).pop()) || 'не обрано'}</span><button data-file="${k}">Обрати</button>${v ? `<button class="ghost" data-clear="${k}" aria-label="Прибрати">✕</button>` : ''}</div>`;
  else if (kind === 'emoji') c = `<input value="${esc(v)}" maxlength="8"><div class="emo">${['😂', '🤣', '🔥', '😱', '💀', '🤯', '👀', '😭', '❤️', '👍', '🎉', '💯'].map(x => `<button data-v="${x}">${x}</button>`).join('')}</div>`;
  else if (kind === 'area') c = `<textarea>${esc(v)}</textarea>`;
  else if (kind === 'audio') c = `<div class="pick"><span>♪ ${esc(o.name || 'не обрано')}</span><button data-audio="1">Інший трек</button></div>`;
  else c = `<input value="${esc(v)}" ${kind === 'font' ? 'list="fontlist" placeholder="Системний"' : ''}>`;
  return `<div data-p="${k}" data-kind="${kind}"><label>${label}</label>${c}</div>`;
}
function readControl(t, cur) {                                    // значення з контролу, або undefined
  const box = t.closest('[data-p]');
  if (t.dataset.v != null) return typeof cur === 'number' ? +t.dataset.v : t.dataset.v;
  if (box.classList.contains('tg')) return t.checked;
  if (t.type === 'range') { box.querySelector('output').textContent = t.value + ' ' + t.dataset.unit; return t.value / t.dataset.mul; }
  if (t.matches('input,textarea')) return t.value;
}

function segItems(e, c, t, k) {                                  // сховати, розрізати, повернути спільне — лише в цьому кліпі
  const rel = toOut(c, clamp(t, c.a, c.b)), segs = segsOf(c, e), own = !!c.segs?.[e.id], x = segs[k], n = net(c);
  const done = () => { if (c.segs?.[e.id]) tidySegs(c, e); save(); renderProps(); };
  return [{hd: 'У цьому кліпі'},
    x && {label: 'Розрізати тут', key: 'B', off: rel <= (x[0] || 0) + .2 || rel >= (x[1] || n) - .2,
          run: () => { const y = ownSegs(c, e)[k], end = y[1]; y[1] = rel; c.segs[e.id].push([rel, end]); done(); }},
    x && segs.length > 1 && {label: 'Прибрати цей шматок', key: 'Del', run: () => removeFromClip(e, c, k)},
    e.type === 'music' && {label: 'З початку треку', off: (e.off || 0) === -(segs[0]?.[0] || 0), run: () => { e.off = -(segs[0]?.[0] || 0); done(); }},
    segs.length ? {label: e.solo ? 'Прибрати з цього кліпу' : 'Сховати в цьому кліпі', key: segs.length > 1 ? '' : 'Del', run: () => removeFromClip(e, c)}
      : {label: 'Показати в цьому кліпі', run: () => { c.segs[e.id] = [[0, 0]]; done(); }},
    !e.solo && own && {label: 'Як у всіх кліпах', run: () => { delete c.segs[e.id]; done(); }},
    !e.solo && own && segs.length === 1 && {label: 'Так у всіх кліпах', run: () => { [e.from, e.to] = segs[0]; for (const o of P.clips) if (o.segs) delete o.segs[e.id]; done(); }},
    {label: e.solo ? 'Зробити глобальним' : 'Зробити не глобальним', key: 'G', run: () => setGlobal(e, !!e.solo)},
    '-'];
}
function elMenu(el, t = vid.currentTime, where = 'з поточного кадру') {

  return [{hd: TYPES[el.type].name},

$('#render').onclick = async () => {
  if (!P || !P.clips.some(c => c.on)) return msg('Немає увімкнених кліпів', 1);
  if (subsEl()?.on && !P.cues.length) msg('Субтитрів ще немає', 1);
  const list = P.clips.slice().sort((x, y) => x.a - y.a).map(c => ({a: c.a, b: c.b, on: c.on, cut: c.cut || []}));
  try { await save(true); await api('/api/render', {id: P.id, clips: list, elements: P.elements, cues: P.cues, music: P.music}); poll(); } catch (e) { msg(e.message, 1); }
};
let outDir = '';
$('#open').onclick = () => api('/api/reveal', {path: outDir});
async function poll() {
  const j = await api('/api/status'); outDir = j.out;
  $('#render').disabled = j.running;
  $('#prog').style.width = (j.n ? ((Math.max(0, j.i - 1) + j.pct) / j.n) * 100 : 0) + '%';

const key = (k, col = '#383634', ink = '#e2dfda') => `<i style="background:${col};color:${ink}">${k}</i>`;
const TOUR = [

  ['#addEl', 'Елементи', '<p>Плашка, чат, алерт, емодзі, вебкамера, музика, субтитри тощо. Новий елемент з’являється в поточному кліпі. Щоб додати його в інший кліп, перетягни елемент зі списку на кліп на таймлайні. Перемикач <b>Глобальний</b> робить елемент частиною всіх кліпів. Для іншого тексту чи треку додай новий елемент.</p>'],
  ['#pv', 'Прев\'ю', `<p>Елементи тягнуться мишею, кут змінює розмір. ${key('Ctrl')} вимикає прилипання.</p><div class="combo">
    <span>${key('Ctrl')} + ${key('C')} / ${key('V')} / ${key('D')}</span><span>копіювати, вставити, дублювати</span>
    <span>${key('Del')}</span><span>видалити вибране</span>

];
let tourI = -1;
function tour(i) {
  tourI = i; const st = TOUR[i], box = $('#tour');
  if (!st) { box.classList.remove('on'); try { localStorage.setItem('tour', '1'); } catch (e) {} return; }
  if (!$('#editor').classList.contains('on')) show('editor');
  const [sel_, title, body] = st, tip = $('#tourTip'), hole = $('#tourHole'), pad = 6;
  box.classList.add('on'); tip.querySelector('.tt-step').textContent = `${i + 1} з ${TOUR.length}`; $('#tourTitle').textContent = title;
  tip.querySelector('.tt-body').innerHTML = body; $('#tourBack').style.visibility = i ? 'visible' : 'hidden'; $('#tourNext').textContent = i === TOUR.length - 1 ? 'Почати' : 'Далі';
  const r = sel_ && $(sel_).getBoundingClientRect(), W = innerWidth, H = innerHeight;
  Object.assign(hole.style, r ? {left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + 2 * pad + 'px', height: r.height + 2 * pad + 'px'}
                              : {left: W / 2 + 'px', top: H / 2 + 'px', width: 0, height: 0});
  const tw = tip.offsetWidth, th = tip.offsetHeight;             // вікно — під ціллю, над нею або збоку, де влазить
  let x = r ? r.left + r.width / 2 - tw / 2 : W / 2 - tw / 2, y = r ? r.bottom + 16 : H / 2 - th / 2;
  if (r && y + th > H - 12) y = r.top - th - 16;
  if (r && y < 12) { y = clamp(r.top + r.height / 2 - th / 2, 12, H - th - 12); x = r.right + 16 + tw < W ? r.right + 16 : r.left - tw - 16; }
  Object.assign(tip.style, {left: clamp(x, 12, W - tw - 12) + 'px', top: clamp(y, 12, H - th - 12) + 'px'});
  $('#tourNext').focus();
}
$('#tourNext').onclick = () => tour(tourI + 1); $('#tourBack').onclick = () => tour(tourI - 1); $('#tourSkip').onclick = () => tour(TOUR.length);
$('#help').onclick = () => tour(0);
addEventListener('resize', () => { if (tourI >= 0 && tourI < TOUR.length && $('#tour').classList.contains('on')) tour(tourI); });
addEventListener('keydown', e => {
  if (!$('#tour').classList.contains('on')) return;
  if (e.key === 'Escape') tour(TOUR.length); else if (e.key === 'ArrowRight') tour(tourI + 1); else if (e.key === 'ArrowLeft' && tourI) tour(tourI - 1); else return;
  e.preventDefault(); e.stopImmediatePropagation();
}, true);
const tourSeen = () => { try { return !!localStorage.getItem('tour'); } catch (e) { return true; } };

const kbd = k => k.split(' / ').map(alt => alt.split('+').map(x => /^(Space|Shift|Ctrl|Alt|Del|Esc|Enter|\S{1,2}|← →)$/.test(x) ? `<kbd>${esc(x)}</kbd>` : esc(x)).join('+')).join(' / ');
$('#keysBody').innerHTML = KEYS.map(([g, list]) => `<section><h4>${g}</h4><dl>${list.map(([k, d]) => `<dt>${kbd(k)}</dt><dd>${d}</dd>`).join('')}</dl></section>`).join('');

(async () => {
  const page = Math.random().toString(36).slice(2), ping = () => api('/api/ping', {page}).catch(() => {});   // програма живе, поки відкрите хоч одне вікно
  ping(); setInterval(ping, 20000);
  const checkUpdate = async () => {                                // нова версія на GitHub — кнопка в шапці
    const u = await api('/api/update').catch(() => ({}));
    $('#upd').hidden = !u.version; if (u.version) $('#upd').textContent = `Оновити до ${u.version}`;
  };
  setTimeout(checkUpdate, 4000);
  document.addEventListener('click', e => { const b = e.target.closest('[data-link]'); if (b) api('/api/open', {link: b.dataset.link}); });   // у звичайному браузері, не у вікні програми
  (async function ffmpegRow() {                                    // перший запуск: ffmpeg завантажується у фоні — показуємо поступ
    const s = await api('/api/status').catch(() => ({}));
    if (s.ffmpeg !== false) return;
    busy(document.createElement('button'), 'ffmpeg', [['ffmpeg', 60]], task => new Promise(done => {
      const iv = setInterval(async () => { const t = await api('/api/status').catch(() => ({})); if (t.ffmpeg) { clearInterval(iv); done(); } }, 1000);
    }), 'ffmpeg');
  })();
  $('#upd').onclick = async () => {
    try {
      const r = await busy($('#upd'), 'Оновлення', [['update', 15]], task => api('/api/update/apply', {task}));
      if (r.kind === 'full') return msg('Встановлюю оновлення. Програма відкриється сама.');
      msg('Перезапускаю…');
      const was = (await api('/api/version').catch(() => ({}))).boot;
      for (let i = 0; i < 60; i++) {                               // піднявся новий процес — перезавантажуємо сторінку
        await new Promise(r => setTimeout(r, 500));
        const v = (await api('/api/version').catch(() => ({}))).boot;
        if (v && v !== was) { window.reloading = true; return location.reload(); }   // це не закриття вікна
      }
      msg('Не вдалося перезапустити. Закрий і відкрий програму.', 1);
    } catch (e) { msg('Оновлення: ' + e.message, 1); }
  };
  addEventListener('pagehide', () => window.reloading || navigator.sendBeacon('/api/bye', JSON.stringify({page})));   // закрили вікно — програма зупиняється одразу
  addEventListener('keydown', e => { if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.code === 'KeyR')) e.preventDefault(); }, true);   // перезавантаження сторінки = закриття вікна, тож його вимкнено
  const s = await api('/api/state'); cfg = s.cfg; renderPops(); setMode('short'); scaleUI();
  api('/api/fonts').then(f => $('#fontlist').innerHTML = f.map(n => `<option value="${esc(n)}">`).join(''));
  if (cfg.project) { const p = await api('/api/project?id=' + cfg.project).catch(() => null); if (p) await openProject(p); }
  show('home'); fitTL();
  if (s.job.running) poll();
})();
